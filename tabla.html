<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>3.Tabla con bgcolor</title>
</head>
<body bgcolor="blue">

    <h2><font color="yellow" face="Arial">3.Tabla</font></h2>
    <hr color="yellow">

            <td bgcolor="green" align="center" valign="middle">
